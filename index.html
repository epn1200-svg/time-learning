<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複名數時間單位換算器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; }
        
        /* 輸入面板 */
        .input-panel {
            background: #eef2f5;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .input-panel input {
            width: 80px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
        }
        .btn-calc {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-calc:hover { background-color: #3498db; }

        /* 圖表呈現區 */
        .visual-section {
            background: #fcfcfc;
            border: 1px solid #eaeded;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            margin: auto;
        }
        .legend-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 15px; height: 15px; border-radius: 3px; }

        /* 教學解釋步驟區 */
        .explanation-section {
            text-align: left;
            background: #fffdf9;
            border-left: 5px solid #f39c12;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 25px;
        }
        .step-title {
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .step-content {
            font-size: 16px;
            padding-left: 15px;
            line-height: 1.6;
        }

        /* 最終數學結果呈現 */
        .final-results {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border-top: 6px solid #333;
        }
        .result-card.fraction { border-top-color: #e67e22; }
        .result-card.decimal { border-top-color: #2ecc71; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #555; }

        /* 數學符號樣式 */
        .math-text { font-size: 32px; font-weight: bold; vertical-align: middle;}
        .math-fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-left: 5px;
        }
        .math-numerator { border-bottom: 3px solid #333; padding: 0 8px; }
        .math-denominator { padding: 0 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🕒 複名數時間單位拆解換算機</h1>
    <p class="subtitle">輸入「幾日幾小時」，看圖形與算式如何一步步把它變成「帶分數」與「小數」日！</p>

    <div class="input-panel">
        <input type="number" id="inputDays" min="0" max="10" value="2"> <span>日</span>
        <input type="number" id="inputHours" min="0" max="23" value="18"> <span>小時</span>
        <button class="btn-calc" onclick="calculateTime()">開始拆解教學</button>
    </div>

    <div class="visual-section">
        <div style="font-weight: bold; margin-bottom: 10px; color:#555;">📊 每日時間分配圖</div>
        <div class="chart-container">
            <canvas id="splitChart"></canvas>
        </div>
        <div class="legend-box">
            <div class="legend-item"><div class="color-box" style="background: #2ecc71;"></div> 完整的整數日 (滿24小時)</div>
            <div class="legend-item"><div class="color-box" style="background: #e67e22;"></div> 剩下的不完整小時</div>
            <div class="legend-item"><div class="color-box" style="background: #e5e8e8;"></div> 未度過的時間</div>
        </div>
    </div>

    <div class="explanation-section">
        <h3 style="margin-top:0; color:#2c3e50;">💡 老師的解題步驟：</h3>
        
        <div class="step-title">第一步：分開來看</div>
        <div class="step-content" id="step1Text"></div>

        <div class="step-title">第二步：把「小時」換算成「日」</div>
        <div class="step-content" id="step2Text"></div>

        <div class="step-title">第三步：與原本的「日」加起來</div>
        <div class="step-content" id="step3Text"></div>
    </div>

    <div class="final-results">
        <div class="result-card fraction">
            <div class="card-title">用【分數】表示 (日)</div>
            <div id="fractionFinal"></div>
        </div>

        <div class="result-card decimal">
            <div class="card-title">用【小數】表示 (日)</div>
            <div id="decimalFinal"></div>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('splitChart').getContext('2d');
    let splitChart;

    // 最大公因數（約分用）
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }

    function initChart() {
        splitChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: [], datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y', // 變成橫向長條圖，更像天數累積
                scales: {
                    x: { stacked: true, max: 24, display: false },
                    y: { stacked: true, grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function calculateTime() {
        const days = parseInt(document.getElementById('inputDays').value) || 0;
        const hours = parseInt(document.getElementById('inputHours').value) || 0;

        if (hours >= 24) {
            alert("小提醒：小時滿 24 小時就要進位到「日」囉！請輸入 0~23 之間。");
            return;
        }

        // 1. 更新圖表
        const labels = [];
        const datasetFull = [];
        const datasetPart = [];
        const datasetEmpty = [];

        // 畫出整數日
        for (let i = 1; i <= days; i++) {
            labels.push(`第 ${i} 天`);
            datasetFull.push(24);
            datasetPart.push(0);
            datasetEmpty.push(0);
        }

        // 畫出不完整的那一天（如果小時 > 0）
        if (hours > 0 || days === 0) {
            labels.push(`第 ${days + 1} 天`);
            datasetFull.push(0);
            datasetPart.push(hours);
            datasetEmpty.push(24 - hours);
        }

        splitChart.data.labels = labels;
        splitChart.data.datasets = [
            { label: '滿日', data: datasetFull, backgroundColor: '#2ecc71', borderWidth: 0 },
            { label: '不完整小時', data: datasetPart, backgroundColor: '#e67e22', borderWidth: 0 },
            { label: '空白', data: datasetEmpty, backgroundColor: '#e5e8e8', borderWidth: 0 }
        ];
        splitChart.update();

        // 2. 計算數學邏輯
        const currentGcd = gcd(hours, 24);
        const simNumerator = hours / currentGcd;
        const simDenominator = 24 / currentGcd;
        const decimalPart = (hours / 24).toFixed(3);
        const cleanDecimalPart = parseFloat(decimalPart);
        const totalDecimal = (days + cleanDecimalPart);

        // 3. 填寫解題步驟文字
        document.getElementById('step1Text').innerHTML = `我們有完整的 <b>${days} 日</b>，和多出來的 <b>${hours} 小時</b>。整數部分的 <b>${days} 日</b> 先保留不動。`;
        
        let step2Html = `因為 1 日 = 24 小時，所以 ${hours} 小時就是：<br>`;
        step2Html += `• <b>分數：</b> 24格裡的${hours}格 $\\rightarrow$ <b style="color:#d35400;">\\frac{${hours}}{24} 日</b>`;
        if (currentGcd > 1) {
            step2Html += ` (約分後是 <b>\\frac{${simNumerator}}{${simDenominator}} 日</b>)`;
        }
        step2Html += `<br>• <b>小數：</b> 用 ${hours} ÷ 24 = <b style="color:#27ae60;">${cleanDecimalPart} 日</b>`;
        document.getElementById('step2Text').innerHTML = step2Html;

        document.getElementById('step3Text').innerHTML = `把整數和剛剛換算出來的部分合併：<br>` + 
            `• <b>分數：</b> ${days} 日 + \\frac{${simNumerator}}{${simDenominator}} 日 = <b>${days}又\\frac{${simNumerator}}{${simDenominator}} 日</b><br>` +
            `• <b>小數：</b> ${days} 日 + ${cleanDecimalPart} 日 = <b>${totalDecimal} 日</b>`;

        // 4. 生成最終卡片的精美數學式
        // 分數卡片
        let fractionHtml = '';
        if (days > 0) {
            fractionHtml += `<span class="math-text">${days}</span>`;
        }
        fractionHtml += `
            <div class="math-fraction" style="color:#d35400;">
                <div class="math-numerator">${simNumerator}</div>
                <div class="math-denominator">${simDenominator}</div>
            </div>
            <span class="math-text" style="font-size:24px; margin-left:5px;">日</span>
        `;
        if (currentGcd > 1) {
            fractionHtml += `<div class="process-text">（原來的 ${days}又\\frac{${hours}}{24} 約分而來）</div>`;
        } else {
            fractionHtml += `<div class="process-text">（已經是最簡分數）</div>`;
        }
        document.getElementById('fractionFinal').innerHTML = fractionHtml;

        // 小數卡片
        let decimalHtml = `
            <span class="math-text" style="color:#27ae60; font-size:42px;">${totalDecimal}</span>
            <span class="math-text" style="font-size:24px; margin-left:5px;">日</span>
            <div class="process-text">（計算公式：${days} + [${hours} ÷ 24]）</div>
        `;
        document.getElementById('decimalFinal').innerHTML = decimalHtml;
    }

    // 啟動
    initChart();
    calculateTime(); // 預設執行 2日 18小時
</script>

</body>
</html>
